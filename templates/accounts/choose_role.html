{% extends "base.html" %}
{% block title %}Sign up · HerHub{% endblock %}
{% block content %}
<div class="text-center mb-4">
  <h2 class="fw-bold">Join HerHub</h2>
  <p class="text-muted">Who are you?</p>
</div>
<div class="row justify-content-center g-4">
  <div class="col-md-5">
    <a href="{% url 'register_customer' %}" class="text-decoration-none">
      <div class="card card-soft p-4 h-100 text-center">
        <h4 class="text-brand">I'm a Customer</h4>
        <p class="text-muted mb-0">I want to find and book services.</p>
      </div>
    </a>
  </div>
  <div class="col-md-5">
    <a href="{% url 'register_provider' %}" class="text-decoration-none">
      <div class="card card-soft p-4 h-100 text-center">
        <h4 class="text-brand">I'm a Service Provider</h4>
        <p class="text-muted mb-0">I want to list my services and get bookings.</p>
      </div>
    </a>
  </div>
</div>
<p class="text-center mt-4">Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
