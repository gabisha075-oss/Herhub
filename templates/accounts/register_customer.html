{% extends "base.html" %}
{% block title %}Customer sign up · HerHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card card-soft p-4">
      <h3 class="mb-1">Create your account</h3>
      <p class="text-muted">Book trusted women service providers near you.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/form_fields.html" %}
        <button type="submit" class="btn btn-brand w-100 py-2">Create account</button>
      </form>
      <p class="text-center small mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
